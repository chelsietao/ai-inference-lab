[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference-lab"
version = "0.1.0"
description = "An interactive playground for GPU computing and AI inference optimization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "numpy",
  "pandas",
  "matplotlib",
  "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: test requires a CUDA GPU (skipped otherwise)"]
